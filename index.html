<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>POLUNDRA Portfolio</title>

  <!-- Шрифти -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Playfair+Display&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #0c0c0c;
      color: #e8dcc0;
      font-family: 'Playfair Display', serif;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      border-bottom: 1px solid #c2a96b;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 42px;
      letter-spacing: 3px;
      margin: 0;
    }

    h2 {
      font-family: 'Cinzel', serif;
      border-bottom: 1px solid #c2a96b;
      padding-bottom: 10px;
    }

    section {
      max-width: 800px;
      margin: auto;
      padding: 50px 20px;
    }

    .projects img {
      width: 100%;
      margin-bottom: 25px;
      border: 1px solid #c2a96b;
      border-radius: 8px;
      filter: grayscale(30%);
      transition: 0.4s;
    }

    .projects img:hover {
      filter: grayscale(0%);
      transform: scale(1.02);
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #c2a96b;
      font-size: 14px;
      opacity: 0.7;
    }

    a {
      color: #c2a96b;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

<header>
  <h1>POLUNDRA</h1>
  <p>portfolio / aesthetics / maritime soul</p>
</header>

<section>
  <h2>Про мене</h2>
  <p>
    Я створюю візуальні історії на межі темряви, естетики та руху.
    Мій стиль — це поєднання класики, глибини та морської свободи.
  </p>
</section>

<section class="projects">
  <h2>Мої роботи</h2>

  <img src="https://via.placeholder.com/800x500" alt="робота 1">
  <img src="https://via.placeholder.com/800x500" alt="робота 2">
  <img src="https://via.placeholder.com/800x500" alt="робота 3">

</section>

<section>
  <h2>Контакти</h2>
  <p>Instagram: @твійнік</p>
  <p>Telegram: @твійнік</p>
</section>

<footer>
  <p>© 2026 POLUNDRA</p>
</footer>

</body>
</html>
